<!DOCTYPE html>
<html>

<head>
    <title> Neuro Nexus </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Full Name" />
    
        <label for="contactNumber">Contact Number</label>
        <input id="contactNumber" name="contactNumber" type="text" placeholder="Contact Number" />
    
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" placeholder="Address"></textarea>
    
        <label for="companyName">Company Name</label>
        <input id="companyName" name="companyName" type="text" placeholder="Company Name" />
    
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" />
    
        <label for="department">Department</label>
        <select id="department" name="department">
          <option value="hr">HR</option>
          <option value="sales">Sales</option>
          <option value="development">Development</option>
          <option value="marketing">Marketing</option>
          <option value="others">Others</option>
        </select>
    
        <label>Gender</label>
        <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="male"> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="female"> Female
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="notToSay"> Prefer not to say
            </label>
          </div>
    
        <button type="submit">Submit</button>
      </form>
</body>

</html>
